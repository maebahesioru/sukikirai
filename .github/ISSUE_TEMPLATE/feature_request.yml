name: 機能要望
description: 新機能・改善の提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        要望ありがとうございます。サイト内の[管理スレ](https://tsuittara-yoron.hikamers.app/meta)でも受け付けています。
  - type: textarea
    id: want
    attributes:
      label: 欲しい機能・改善
      description: どんな機能が欲しいか、どう改善してほしいか
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 理由・背景
      description: なぜ欲しいか（困っていること等）
    validations:
      required: false
